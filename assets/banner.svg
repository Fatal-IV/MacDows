<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="MacDows: a Dynamic Island and a dock for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#17143a"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c8ff"/>
    </linearGradient>
    <linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient>
    <linearGradient id="i2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff453a"/></linearGradient>
    <linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee07a"/><stop offset="1" stop-color="#1fa74a"/></linearGradient>
    <linearGradient id="i4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98bff"/><stop offset="1" stop-color="#7d4cff"/></linearGradient>
    <linearGradient id="i5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
    <clipPath id="clip"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#glowA)"/>
    <rect width="1280" height="400" fill="url(#glowB)"/>

    <!-- the island: attached to the top edge, with the small inverse corners -->
    <g>
      <path d="M452 0 H468 V16 A16 16 0 0 0 452 0 Z M828 0 H812 V16 A16 16 0 0 1 828 0 Z" fill="#000"/>
      <path d="M468 0 H812 V32 A26 26 0 0 1 786 58 H494 A26 26 0 0 1 468 32 Z" fill="#000" stroke="#fff" stroke-opacity="0.14"/>
      <!-- cover art -->
      <rect x="486" y="12" width="34" height="34" rx="9" fill="url(#i4)"/>
      <path d="M498 36 V24 l12 -2 v12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="497" cy="36.5" r="2.6" fill="#fff"/><circle cx="509" cy="34.5" r="2.6" fill="#fff"/>
      <!-- title lines -->
      <rect x="532" y="19" width="92" height="7" rx="3.5" fill="#fff" fill-opacity="0.9"/>
      <rect x="532" y="33" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.45"/>
      <!-- visualizer -->
      <g fill="#64d2ff">
        <rect x="716" y="24" width="4" height="12" rx="2"/>
        <rect x="725" y="17" width="4" height="26" rx="2"/>
        <rect x="734" y="21" width="4" height="18" rx="2"/>
        <rect x="743" y="14" width="4" height="32" rx="2"/>
        <rect x="752" y="20" width="4" height="20" rx="2"/>
        <rect x="761" y="25" width="4" height="10" rx="2"/>
      </g>
      <!-- clock -->
      <text x="796" y="35" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">9:41</text>
    </g>

    <!-- title -->
    <text x="640" y="200" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#title)">MacDows</text>
    <text x="640" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="25" fill="#c9d3ff" fill-opacity="0.9">A Dynamic Island and a dock for Windows</text>

    <!-- the dock -->
    <g>
      <path d="M390 400 V374 Q390 340 424 340 H856 Q890 340 890 374 V400 Z" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M390 400 V374 Q390 340 424 340 H856 Q890 340 890 374 V400" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
      <rect x="426" y="352" width="46" height="46" rx="13" fill="url(#i1)"/>
      <rect x="484" y="352" width="46" height="46" rx="13" fill="url(#i2)"/>
      <rect x="542" y="352" width="46" height="46" rx="13" fill="url(#i3)"/>
      <rect x="600" y="352" width="46" height="46" rx="13" fill="url(#i4)"/>
      <rect x="658" y="352" width="46" height="46" rx="13" fill="url(#i5)"/>
      <rect x="716" y="352" width="46" height="46" rx="13" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="734" y="368" width="10" height="14" rx="3" fill="#fff" fill-opacity="0.7"/>
      <rect x="780" y="358" width="1.5" height="34" fill="#fff" fill-opacity="0.25"/>
      <rect x="800" y="352" width="46" height="46" rx="13" fill="#ffffff" fill-opacity="0.16"/>
      <path d="M811 384 h24 l-2 -14 h-20 z M815 366 q8 -8 16 0" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
