[package]
name = "macdows"
version = "0.2.5"
description = "A Dynamic Island and a dock for Windows"
authors = ["Fatal-IV"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "macdows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Rras", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Security_Cryptography", "Foundation", "Foundation_Collections", "Networking_Connectivity", "Networking_NetworkOperators", "Devices_Radios", "Devices_Bluetooth", "Devices_Enumeration", "Devices_Enumeration_Pnp", "Win32_Devices_Bluetooth", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Media_Control", "Storage_Streams", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Storage_Xps", "Win32_Security_Authentication_Identity", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls_Dialogs"] }
png = "0.17"
winreg = "0.55"
base64 = "0.22"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-drag = "2.1.1"
windows-collections = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
