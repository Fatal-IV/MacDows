name: Release

# Started by hand only (Actions > Release > Run workflow, choosing the version tag as the ref). Releases are built, signed and
# uploaded from the maintainer's PC; a tag push must not start this and overwrite those files (latest.json above all).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Check tag matches version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          C=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$V" = "$C" ] || { echo "Tag $V != tauri.conf.json $C"; exit 1; }
      - name: Extract release notes
        shell: bash
        run: node scripts/extract-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MacDows ${{ github.ref_name }}
          releaseBodyPath: release-notes.md
          releaseDraft: false
          prerelease: false
      - name: Build the branded installer
        shell: bash
        run: node scripts/build-installer.mjs --skip-app
      - name: Add the installer and checksums to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" installer/dist/MacDows-Setup.exe installer/dist/SHA256SUMS.txt --clobber
