<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacDows</title>
<meta name="description" content="A Dynamic Island and a dock for Windows.">
<style>
  :root { --bg:#ffffff; --fg:#1c1c1e; --muted:#5f6368; --card:#f4f5f7; --line:#dfe1e5; --accent:#0a6ed1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#f2f2f4; --muted:#a0a4ab; --card:#1b1d21; --line:#2b2e34; --accent:#64a8ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  img { width: 100%; height: auto; border-radius: 18px; }
  h1 { font-size: 2.4rem; margin: 1.2rem 0 .2rem; letter-spacing: -0.02em; }
  p { color: var(--muted); }
  .btn { display:inline-block; margin: 1rem .4rem; padding: 12px 24px; border-radius: 10px; background: var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .btn.alt { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  footer { margin-top: 2.5rem; font-size: .9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="assets/banner.svg" alt="MacDows: a Dynamic Island and a dock for Windows">
  <h1>MacDows</h1>
  <p>A Dynamic Island and a dock for Windows.<br>Windows için bir Dynamic Island ve dock.</p>
  <a class="btn" href="https://github.com/Fatal-IV/MacDows/releases/latest">Download &middot; İndir</a>
  <a class="btn alt" href="privacy/">Privacy policy &middot; Gizlilik politikası</a>
  <footer><a href="https://github.com/Fatal-IV/MacDows">github.com/Fatal-IV/MacDows</a> &middot; Fatal IV</footer>
</main>
</body>
</html>
