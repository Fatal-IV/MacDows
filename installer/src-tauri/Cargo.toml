[package]
name = "macdows-setup"
version = "0.1.0"
description = "MacDows installer"
authors = ["Fatal-IV"]
edition = "2021"
license = "MIT"

[lib]
name = "macdows_setup_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
